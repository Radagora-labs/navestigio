name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: sql.js de vendor/ es idéntico al publicado en npm
        run: python build.py --verificar-npm

      - name: Regenerar la app desde src/ y vendor/
        run: python build.py

      - name: app/navestigio.html, el número de versión y la dirección del sitio coinciden con las fuentes
        run: git diff --exit-code -- app/navestigio.html README.md docs package.json && test -z "$(git status --porcelain -- docs)"

      - name: Revisar la sintaxis de los scripts de Python
        run: python -m py_compile build.py app/servir_navestigio.py tests/fixtures.py tests/servidor.py tests/revisar_html.py

      - name: Cada asignación de HTML en src/ está revisada
        run: python tests/revisar_html.py

      - name: El servidor local solo atiende a la propia aplicación
        run: python tests/servidor.py

      - name: Instalar Playwright y Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Prueba de humo en Chromium
        run: npm test
